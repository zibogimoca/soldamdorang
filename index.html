<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>솔담도랑</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="brand"><span>✳</span> 솔담도랑 <small>SOLDAMDORANG</small></div><span class="tag">천천히 머물다 가세요</span></header><section class="intro"><p>숲이 보이는 작은 책방</p><h1>오늘은 여기서,<br><em>잠시 쉬어가요.</em></h1><div class="desc">나무 사이로 들어오는 햇살과 책장 넘기는 소리.<br>아무것도 하지 않아도 좋은 곳이에요.</div></section><div class="scene" role="img" aria-label="숲이 보이는 통창과 나무 테이블이 있는 아늑한 책방의 콘셉트 일러스트"><div class="sun"></div><div class="window"><div class="mountain m1"></div><div class="mountain m2"></div><div class="trees">♠　♠　♠　♠　♠　♠　♠　♠</div></div><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div><div class="floor"></div><div class="rug"></div><div class="shelf"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="plant">✿<span>▰</span></div><div class="table"><button class="book" id="open-books" aria-label="책 둘러보기">📚</button><div class="cup">☕</div></div><div class="chair c1"></div><div class="chair c2"></div><div class="character"><div class="ears">●　●</div><div class="face">•ᴗ•</div><div class="body"></div></div><div class="scene-label"><span>●</span> BOOKSHOP <small>햇살이 머무는 곳</small></div></div><footer><div><b>01</b><span>책방의 오후<small>숲과 책 사이, 느린 시간</small></span></div><p>이 화면은 분위기를 확인하기 위한 콘셉트 시안입니다.</p><div class="dots">● <span>● ●</span></div></footer><section class="catalog"><div><p class="eyebrow">FOREST BOOKSHELF</p><h2>책방의 책들</h2><p>마음에 드는 책을 눌러 살펴보세요.</p></div><div id="book-list" class="book-list"></div></section><dialog id="book-dialog"><button class="close" aria-label="닫기">×</button><div id="book-details"></div></dialog></main><script src="books.js"></script></body></html>
