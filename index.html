<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>솔담도랑</title><link rel="stylesheet" href="style.css"></head><body><main><canvas id="world" aria-label="솔담도랑 가상 책방"></canvas><div id="welcome" class="overlay"><div class="welcome-card"><p class="eyebrow">SOLDAMDORANG</p><h1>솔담도랑에 오신 걸<br>환영해요</h1><p>함께 산책할 친구를 골라주세요.</p><div class="characters"><label><input type="radio" name="character" value="sage" checked><span>🐻<small>숲색 친구</small></span></label><label><input type="radio" name="character" value="peach"><span>🐻<small>복숭아 친구</small></span></label><label><input type="radio" name="character" value="blue"><span>🐻<small>하늘색 친구</small></span></label></div><button id="start" class="primary">책방으로 가기</button></div></div><div id="game-ui" hidden><header><div class="brand">✳ 솔담도랑</div><span id="location">책방 앞</span></header><div class="guide" id="hint">가고 싶은 곳을 터치하세요.</div><div class="controls"><button id="enter">책방 들어가기</button><button id="exit" hidden>밖으로 나가기</button><button id="sit" hidden>의자에 앉기</button><button id="read" hidden>책장 넘기기</button><button id="stand" hidden>일어서기</button></div></div><dialog id="book-dialog"><button class="close" aria-label="닫기">×</button><div id="book-details"></div></dialog></main><script type="module" src="world.js"></script></body></html>
